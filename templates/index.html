<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MKT Prediction</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background: #f8f9fa; }
    .card { max-width: 480px; margin: 80px auto; }
    #result { font-size: 2rem; font-weight: 700; color: #0d6efd; }
  </style>
</head>
<body>
  <div class="card shadow-sm p-4">
    <h4 class="mb-1">MKT Sales Prediction</h4>
    <p class="text-muted small mb-4">Insira os investimentos por canal para prever as vendas.</p>

    <form id="form">
      <div class="mb-3">
        <label class="form-label">YouTube ($)</label>
        <input type="number" class="form-control" id="youtube" min="0" step="0.01" value="100" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Facebook ($)</label>
        <input type="number" class="form-control" id="facebook" min="0" step="0.01" value="150" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Newspaper ($)</label>
        <input type="number" class="form-control" id="newspaper" min="0" step="0.01" value="50" required />
      </div>
      <button type="submit" class="btn btn-primary w-100">Prever</button>
    </form>

    <div id="output" class="text-center mt-4 d-none">
      <p class="text-muted mb-1">Vendas previstas</p>
      <div id="result"></div>
    </div>

    <div id="error" class="alert alert-danger mt-3 d-none"></div>
  </div>

  <script>
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();

      const output = document.getElementById("output");
      const errorEl = document.getElementById("error");
      output.classList.add("d-none");
      errorEl.classList.add("d-none");

      const payload = {
        youtube:   parseFloat(document.getElementById("youtube").value),
        facebook:  parseFloat(document.getElementById("facebook").value),
        newspaper: parseFloat(document.getElementById("newspaper").value),
      };

      const res = await fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });

      const data = await res.json();

      if (!res.ok) {
        errorEl.textContent = data.error ?? "Erro inesperado.";
        errorEl.classList.remove("d-none");
        return;
      }

      document.getElementById("result").textContent = `$${data.sales.toFixed(2)}`;
      output.classList.remove("d-none");
    });
  </script>
</body>
</html>
